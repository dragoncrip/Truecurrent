name: Update Funding 7d Average

on:
  schedule:
    - cron: '0 */12 * * *'   # cada 12 horas
  workflow_dispatch:

permissions:
  contents: write          # ← esto es lo importante

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # opcional pero recomendado

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python funding_7d.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add funding_7d.json
          git diff --staged --quiet || git commit -m "update funding 7d average $(date -u +'%Y-%m-%d %H:%M')"
          git push
