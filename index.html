<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TrueCurrent Funding</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; margin: 0; }
    h1 { text-align: center; margin-bottom: 5px; }
    #updated { text-align: center; color: #8b949e; margin-bottom: 15px; }
    #search { display: block; margin: 0 auto 12px; padding: 10px 16px; width: 300px; font-size: 16px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #c9d1d9; }
    .filters { text-align: center; margin-bottom: 20px; }
    .filters label { margin: 0 15px; cursor: pointer; font-size: 15px; }
    .filters input { margin-right: 6px; transform: scale(1.1); }
    .container { max-width: 1100px; margin: 0 auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #30363d; }
    th { background: #161b22; cursor: pointer; user-select: none; }
    th:hover { background: #1f2630; }
    th .arrow { font-size: 10px; margin-left: 4px; opacity: 0.6; }
    tr:hover { background: #161b22; }
    .positive { color: #3fb950; font-weight: 500; }
    .negative { color: #f85149; font-weight: 500; }
    .badge { 
      display: inline-block; 
      font-size: 9px; 
      padding: 1px 4px; 
      border-radius: 3px; 
      margin-left: 5px; 
      font-weight: 600; 
      vertical-align: middle;
    }
    .badge-crypto { background: #238636; color: white; }
    .badge-rwa { background: #9e6a03; color: white; }
  </style>
</head>
<body>
  <h1>TrueCurrent – Funding Rate (Anualizado)</h1>
  <p id="updated">Cargando...</p>
  <input type="text" id="search" placeholder="Buscar token (ej. FIL, BTC, NVDA...)">

  <div class="filters">
    <label><input type="checkbox" id="filter-crypto" checked> Crypto</label>
    <label><input type="checkbox" id="filter-rwa" checked> RWA</label>
  </div>

  <div class="container">
    <table>
      <thead>
        <tr>
          <th data-key="cleanName">Activo</th>
          <th data-key="avg_7d_annualized_%">Funding 7d <span class="arrow"></span></th>
          <th data-key="avg_3d_annualized_%">Funding 3d <span class="arrow"></span></th>
          <th data-key="avg_24h_annualized_%">Funding 24h <span class="arrow"></span></th>
          <th data-key="current_funding_annualized_%">Funding Actual <span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    let data = [];
    let currentSortKey = "avg_7d_annualized_%";
    let currentSortDesc = true;

    function cleanTicker(ticker) {
      return (ticker || "")
        .replace('/USDC PERP', '')
        .replace('/USDT PERP', '')
        .replace(' PERP', '')
        .trim();
    }

    async function loadData() {
      try {
        const res = await fetch('funding_7d.json?v=' + Date.now());
        if (!res.ok) throw new Error("No se pudo cargar el JSON");
        const json = await res.json();
        data = (json.data || []).map(item => ({
          ...item,
          cleanName: cleanTicker(item.ticker),
          type: item.type || "CRYPTO"
        }));
        document.getElementById('updated').textContent = 
          `Actualizado: ${json.updated_at ? new Date(json.updated_at).toLocaleString() : '—'} | ${json.count || data.length} mercados`;
        render();
      } catch (e) {
        document.getElementById('updated').textContent = "Error cargando datos: " + e.message;
        console.error(e);
      }
    }

    function formatValue(value) {
      if (value == null) return '—';
      const num = Number(value);
      return `<span class="${num >= 0 ? 'positive' : 'negative'}">${num.toFixed(2)}%</span>`;
    }

    function formatRow(r) {
      const badge = r.type === "RWA" 
        ? '<span class="badge badge-rwa">RWA</span>' 
        : '<span class="badge badge-crypto">CRYPTO</span>';

      return `
        <tr>
          <td>${r.cleanName}${badge}</td>
          <td>${formatValue(r["avg_7d_annualized_%"])}</td>
          <td>${formatValue(r["avg_3d_annualized_%"])}</td>
          <td>${formatValue(r["avg_24h_annualized_%"])}</td>
          <td>${formatValue(r["current_funding_annualized_%"])}</td>
        </tr>
      `;
    }

    function render() {
      const search = document.getElementById('search').value.toLowerCase().trim();
      const showCrypto = document.getElementById('filter-crypto').checked;
      const showRwa = document.getElementById('filter-rwa').checked;

      let filtered = data.filter(item => {
        if (item.type === "CRYPTO" && !showCrypto) return false;
        if (item.type === "RWA" && !showRwa) return false;
        if (search && !item.cleanName.toLowerCase().includes(search)) return false;
        return true;
      });

      filtered.sort((a, b) => {
        let va = a[currentSortKey];
        let vb = b[currentSortKey];
        if (va == null) va = currentSortDesc ? -Infinity : Infinity;
        if (vb == null) vb = currentSortDesc ? -Infinity : Infinity;
        if (typeof va === "string") {
          return currentSortDesc ? vb.localeCompare(va) : va.localeCompare(vb);
        }
        return currentSortDesc ? vb - va : va - vb;
      });

      document.getElementById('tbody').innerHTML = filtered.map(formatRow).join('') || '<tr><td colspan="5">Sin resultados</td></tr>';

      // Actualizar flechas
      document.querySelectorAll('th .arrow').forEach(el => el.textContent = '');
      const activeTh = document.querySelector(`th[data-key="${currentSortKey}"] .arrow`);
      if (activeTh) activeTh.textContent = currentSortDesc ? '▼' : '▲';
    }

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('filter-crypto').addEventListener('change', render);
    document.getElementById('filter-rwa').addEventListener('change', render);

    document.querySelectorAll('th[data-key]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        if (currentSortKey === key) {
          currentSortDesc = !currentSortDesc;
        } else {
          currentSortKey = key;
          currentSortDesc = true;
        }
        render();
      });
    });

    loadData();
  </script>
</body>
</html>
